<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login didático</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Acessar minha conta</h1>
    <p class="hint">Conta válida: ana@exemplo.com / SenhaSegura123!</p>
    <form id="login-form" novalidate>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password">
      <button type="submit">Entrar</button>
      <p id="mensagem" role="alert" hidden></p>
    </form>
    <nav>
      <a href="/idade">Testar idade</a>
      <a href="/frete">Atividade: frete</a>
      <a href="/senha">Atividade: senha</a>
    </nav>
  </main>
  <script src="/login.js"></script>
</body>
</html>
