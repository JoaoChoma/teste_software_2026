<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validação de idade</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Cadastro de paciente</h1>
    <p>A idade deve ser um número inteiro de 18 a 65, inclusive.</p>
    <form id="idade-form" novalidate>
      <label for="idade">Idade</label>
      <input id="idade" name="idade" inputmode="numeric">
      <button type="submit">Validar cadastro</button>
      <p id="resultado" hidden></p>
    </form>
    <nav><a href="/login">Voltar ao login</a></nav>
  </main>
  <script src="/idade.js"></script>
</body>
</html>
